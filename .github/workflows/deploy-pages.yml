name: Deploy Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "GitHub repository to deploy, e.g. 0suu/SwitchBotController"
        required: true
        default: "0suu/SwitchBotController"
        type: string
      ref:
        description: "Branch, tag, or SHA to deploy"
        required: true
        default: "main"
        type: string
      pages_branch:
        description: "Cloudflare Pages preview branch name. Defaults to ref."
        required: false
        type: string
      project_name:
        description: "Cloudflare Pages project name"
        required: true
        default: "switchbot-controller"
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      - name: Resolve Pages branch
        id: pages-branch
        shell: bash
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_PAGES_BRANCH: ${{ inputs.pages_branch }}
        run: |
          if [[ -n "$INPUT_PAGES_BRANCH" ]]; then
            echo "name=$INPUT_PAGES_BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "name=$INPUT_REF" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web preview
        run: npm run build:web

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ inputs.project_name }} --branch=${{ steps.pages-branch.outputs.name }}
